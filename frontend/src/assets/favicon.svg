<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g transform="translate(256, 256) scale(1.8)">
    <!-- Arch 1: Wedding (Elegance / Deep Violet) -->
    <path d="M 0 -130 A 75 75 0 0 1 75 -55 L 75 45 A 75 75 0 0 1 -75 45 L -75 -55 A 75 75 0 0 1 0 -130 Z" 
          fill="#8B5CF6" opacity="0.92" />
    
    <!-- Arch 2: Birthday (Energy / Coral Flame) rotated 120deg -->
    <g transform="rotate(120)">
      <path d="M 0 -130 A 75 75 0 0 1 75 -55 L 75 45 A 75 75 0 0 1 -75 45 L -75 -55 A 75 75 0 0 1 0 -130 Z" 
            fill="#F43F5E" opacity="0.92" />
    </g>
    
    <!-- Arch 3: Community (Warmth / Sun Amber) rotated 240deg -->
    <g transform="rotate(240)">
      <path d="M 0 -130 A 75 75 0 0 1 75 -55 L 75 45 A 75 75 0 0 1 -75 45 L -75 -55 A 75 75 0 0 1 0 -130 Z" 
            fill="#F59E0B" opacity="0.92" />
    </g>

    <!-- Center Convergence Core: The Planning Nexus -->
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" />
  </g>
</svg>
