name: Planora AI CI

on:
  push:
    branches: [main, integration-persistence, quality-security-accessibility]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test & Security Hardening
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: planora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/planora_test"
        run: python -m alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/planora_test"
          SESSION_COOKIE_SECURE: "false"
          SESSION_SECRET_KEY: "ci-secret-key-that-is-at-least-32-bytes-long"
        run: |
          python -m pytest -v

  frontend-check:
    name: Frontend Lint & Production Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compile & Vite Build
        run: npm run build
